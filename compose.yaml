services:
  # MongoDB
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: "1234"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mongodb_network
    healthcheck:
      test:
        - CMD
        - mongosh
        - "mongodb://localhost:27017/admin"
        - "--eval=db.runCommand({ping:1})"
      retries: 3
      timeout: 5s

  # Mongo Express
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://user:1234@mongodb:27017
      ME_CONFIG_BASICAUTH_USERNAME: user
      ME_CONFIG_BASICAUTH_PASSWORD: "1234"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    depends_on:
      - mongodb
    networks:
      - mongodb_network

  # RAG (Flask). The container only serves the existing index. To index the PDFs
  # in rag/data (costs Gemini credits), then restart so the server sees the new pages:
  #   docker compose run --rm rag python ingest.py && docker compose restart rag
  # Set AUTO_INGEST=1 in rag/.env to index on every start instead.
  rag:
    build: ./rag
    container_name: rag
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./rag/.env
    volumes:
      - ./rag/data:/app/data:ro
      - rag_chroma:/app/chroma
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"
      interval: 30s
      start_period: 120s
      retries: 3
      timeout: 5s

volumes:
  mongodb_data:
    driver: local
  rag_chroma:

networks:
  mongodb_network:
    driver: bridge

# credentials for mongo-express admin/pass
# Username: user
# Password: 1234
