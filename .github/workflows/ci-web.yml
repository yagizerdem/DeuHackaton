name: Deploy web to Vercel

# Deploys apps/web when a tag like web-v1.2.3 is pushed, or by hand from the
# Actions tab. Nothing is deployed on a plain push.
on:
  push:
    tags:
      - "web-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # the web app depends on the workspace packages, so install from the root
      - name: Install dependencies
        run: npm ci

      # the packages are imported through their dist folders, which git does not hold
      - name: Build the workspace packages
        run: npx tsc -b packages/shared packages/dto packages/validators

      - name: Build the web app
        run: npm run build -w @DeparkHackaton/web
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}

      # Vercel's Build Output API: the Vite output is the static site, and every
      # other path falls back to index.html so react-router can handle it.
      # Building here means the Vercel project's root directory setting is not used.
      - name: Package the build output for Vercel
        run: |
          mkdir -p .vercel/output
          cp -r apps/web/dist .vercel/output/static
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
